name: Publish Virena Design Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DEPLOY_BASE: /virena-design-lab/
      - name: Check out the TES-255 review version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0b35fd89d3fed516c5243c6fdacfdb33a1043325
          path: tes-255-review
          persist-credentials: false
      - name: Build storefront review
        working-directory: tes-255-review
        env:
          DEPLOY_BASE: /virena-design-lab/tes-255/
        run: |
          npm ci
          npm run build
          mv dist ../dist/tes-255
      - name: Check out the business center review version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 279ebfbe46a8ec92978f39bc539c3fb2e9e92796
          path: bc-review
          persist-credentials: false
      - name: Build business center review
        working-directory: bc-review
        env:
          DEPLOY_BASE: /virena-design-lab/bc/
        run: |
          npm ci
          npm run build
          mv dist ../dist/bc
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
